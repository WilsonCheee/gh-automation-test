name: AI Implementation
on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: AI implements solution
        uses: actions/github-script@v7
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const issueNum = issue.number;
            const branchName = 'ai/issue-' + issueNum;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNum
            });
            const aiProposal = comments.find(c => c.body.includes('AI Solution Proposal'));
            const proposalText = aiProposal ? aiProposal.body : '';

            // Get file contents
            const { data: tree } = await github.rest.git.getTree({
              owner: context.repo.owner, repo: context.repo.repo,
              tree_sha: 'main', recursive: 'true'
            });

            let fileContents = '';
            for (const file of tree.tree.filter(t => t.type === 'blob' && !t.path.startsWith('.github/'))) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner, repo: context.repo.repo, path: file.path
                });
                fileContents += '\n--- ' + file.path + ' ---\n' + Buffer.from(data.content, 'base64').toString() + '\n';
              } catch(e) {}
            }

            const prompt = 'Implement a fix for this GitHub issue.\n\nIssue: ' + issue.title + '\nDescription: ' + (issue.body || '') + '\n\nProposal: ' + proposalText + '\n\nCurrent files:\n' + fileContents + '\n\nReturn ONLY a JSON array of file changes: [{"path":"file.ext","content":"full content"}]\nNo markdown fences. No explanation. Just the JSON array.';

            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + process.env.OPENAI_KEY
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [{ role: 'user', content: prompt }],
                max_tokens: 2000,
                temperature: 0.2
              })
            });

            const data = await resp.json();
            if (data.error) throw new Error(data.error.message);
            let reply = data.choices[0].message.content.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();

            let changes;
            try { changes = JSON.parse(reply); } catch(e) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNum,
                body: '❌ AI failed to generate valid code.\n\n<details><summary>Raw</summary>\n\n```\n' + reply + '\n```\n</details>'
              });
              return;
            }

            // Create branch
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main'
            });
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: 'refs/heads/' + branchName, sha: ref.object.sha
            });

            // Commit files
            for (const change of changes) {
              const existing = await (async () => {
                try {
                  const { data } = await github.rest.repos.getContent({
                    owner: context.repo.owner, repo: context.repo.repo,
                    path: change.path, ref: branchName
                  });
                  return data.sha;
                } catch(e) { return null; }
              })();

              const params = {
                owner: context.repo.owner, repo: context.repo.repo,
                path: change.path,
                message: 'feat: ' + change.path + ' - implements #' + issueNum,
                content: Buffer.from(change.content).toString('base64'),
                branch: branchName
              };
              if (existing) params.sha = existing;
              await github.rest.repos.createOrUpdateFileContents(params);
            }

            // Create PR
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '🤖 ' + issue.title,
              head: branchName, base: 'main',
              body: 'Closes #' + issueNum + '\n\nAI-generated implementation.'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNum,
              body: '🚀 PR #' + pr.number + ' created! Review and merge to close this issue.'
            });
