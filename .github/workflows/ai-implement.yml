name: AI Implementation
on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: AI implements solution
        uses: actions/github-script@v7
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const issueNum = issue.number;
            const branchName = `ai/issue-${issueNum}`;
            
            // Get issue comments (AI proposal)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNum
            });
            const aiProposal = comments.find(c => c.body.includes('AI Solution Proposal'))?.body || '';
            
            // Get all file contents
            const { data: tree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: 'main',
              recursive: 'true'
            });
            
            let fileContents = '';
            for (const file of tree.tree.filter(t => t.type === 'blob' && !t.path.startsWith('.github/'))) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: file.path
                });
                const content = Buffer.from(data.content, 'base64').toString();
                fileContents += `\n--- ${file.path} ---\n${content}\n`;
              } catch(e) {}
            }
            
            const prompt = `You are a developer implementing a fix for a GitHub issue.

            Issue: ${issue.title}
            Description: ${issue.body || '(none)'}
            
            AI Proposal: ${aiProposal}
            
            Current files:
            ${fileContents}
            
            Return a JSON array of file changes. Each element:
            {"path": "file/path.ext", "content": "full file content"}
            
            Only return the JSON array, no markdown fences, no explanation.`;
            
            const resp = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${process.env.GEMINI_KEY}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: { temperature: 0.2 }
                })
              }
            );
            const data = await resp.json();
            let reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
            
            // Clean markdown fences if present
            reply = reply.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
            
            let changes;
            try {
              changes = JSON.parse(reply);
            } catch(e) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNum,
                body: `❌ AI failed to generate valid code.\n\n<details><summary>Raw output</summary>\n\n\`\`\`\n${reply}\n\`\`\`\n</details>`
              });
              return;
            }
            
            // Create branch
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: 'heads/main'
            });
            
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/heads/${branchName}`,
              sha: ref.object.sha
            });
            
            // Commit changes
            for (const change of changes) {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner, repo: context.repo.repo,
                path: change.path,
                message: `feat: ${change.path} - implements #${issueNum}`,
                content: Buffer.from(change.content).toString('base64'),
                branch: branchName,
                ...(await (async () => {
                  try {
                    const { data } = await github.rest.repos.getContent({
                      owner: context.repo.owner, repo: context.repo.repo,
                      path: change.path, ref: branchName
                    });
                    return { sha: data.sha };
                  } catch(e) { return {}; }
                })())
              });
            }
            
            // Create PR
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `🤖 ${issue.title}`,
              head: branchName,
              base: 'main',
              body: `Closes #${issueNum}\n\nAI-generated implementation based on the approved proposal.`
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNum,
              body: `🚀 Implementation ready! PR #${pr.number} created.\n\nReview → merge → this issue closes automatically.`
            });
