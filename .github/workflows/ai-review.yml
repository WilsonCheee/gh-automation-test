name: AI Code Review
on:
  pull_request:
    types: [opened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI reviews code
        uses: actions/github-script@v7
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const pr = context.payload.pull_request;

            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr.number,
              mediaType: { format: 'diff' }
            });

            const prompt = 'Review this PR.\n\nTitle: ' + pr.title + '\nBody: ' + (pr.body || '') + '\n\nDiff:\n' + diff.substring(0, 6000) + '\n\nReview: 1) Correctness 2) Bugs 3) Quality\nVerdict: APPROVE or REQUEST_CHANGES\nBe concise, use markdown.';

            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + process.env.OPENAI_KEY
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [{ role: 'user', content: prompt }],
                max_tokens: 1000
              })
            });

            const data = await resp.json();
            if (data.error) throw new Error(data.error.message);
            const review = data.choices[0].message.content;

            await github.rest.pulls.createReview({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr.number,
              body: '🔍 **AI Code Review**\n\n' + review,
              event: review.toLowerCase().includes('request_changes') ? 'REQUEST_CHANGES' : 'COMMENT'
            });
