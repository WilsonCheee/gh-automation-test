name: AI Solution Proposal
on:
  issues:
    types: [opened]

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: AI proposes solution
        uses: actions/github-script@v7
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;

            const { data: tree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: 'main',
              recursive: 'true'
            });
            const files = tree.tree.filter(t => t.type === 'blob' && !t.path.startsWith('.github/')).map(t => t.path).join('\n');

            const prompt = 'You are a senior developer. An issue was filed:\n\nTitle: ' + issue.title + '\nBody: ' + (issue.body || '(none)') + '\n\nRepo files:\n' + files + '\n\nPropose a concise solution plan:\n1. Which files to modify/create\n2. What changes\n3. Implementation approach\n\nUse markdown. End with: Add label `approved` to start implementation.';

            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + process.env.OPENAI_KEY
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [{ role: 'user', content: prompt }],
                max_tokens: 1000
              })
            });

            const data = await resp.json();
            console.log('Status:', resp.status);

            if (data.error) throw new Error(data.error.message);
            const reply = data.choices[0].message.content;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: '🤖 **AI Solution Proposal**\n\n' + reply
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['ai-proposed']
            });
