name: AI Solution Proposal
on:
  issues:
    types: [opened]

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: AI proposes solution
        uses: actions/github-script@v7
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            
            // Get repo file list for context
            const { data: tree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: 'main',
              recursive: 'true'
            });
            const files = tree.tree.filter(t => t.type === 'blob').map(t => t.path).join('\n');
            
            const prompt = `You are a senior developer. An issue was filed in a GitHub repo.

            Issue title: ${issue.title}
            Issue body: ${issue.body || '(no description)'}
            
            Repo files:
            ${files}
            
            Propose a solution plan:
            1. Which files to modify/create
            2. What changes to make
            3. Brief implementation approach
            
            Keep it concise. Use markdown formatting. End with "Add label \`approved\` to start implementation."`;
            
            const resp = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${process.env.GEMINI_KEY}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }]
                })
              }
            );
            const data = await resp.json();
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Failed to generate proposal.';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🤖 **AI Solution Proposal**\n\n${reply}`
            });
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['ai-proposed']
            });
